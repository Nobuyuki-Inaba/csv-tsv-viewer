<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="55%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" rx="20" fill="url(#bg)"/>

  <!-- ── Table card ── -->
  <rect x="14" y="14" width="100" height="72" rx="8" fill="#ffffff"/>

  <!-- Row-number gutter (bottom-left corner follows the card radius) -->
  <path d="M14 32 H30 V86 H22 A8 8 0 0 1 14 78 Z" fill="#ecfdf5"/>

  <!-- Header band (top corners follow the card radius) -->
  <path d="M14 22 A8 8 0 0 1 22 14 H106 A8 8 0 0 1 114 22 V32 H14 Z" fill="#0f766e"/>

  <!-- Header labels -->
  <rect x="35" y="20" width="16" height="6" rx="3" fill="#ffffff" opacity="0.95"/>
  <rect x="63" y="20" width="14" height="6" rx="3" fill="#ffffff" opacity="0.95"/>
  <rect x="91" y="20" width="12" height="6" rx="3" fill="#ffffff" opacity="0.95"/>

  <!-- Grid: horizontal rules -->
  <line x1="14" y1="50" x2="114" y2="50" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="14" y1="68" x2="114" y2="68" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Grid: vertical rules -->
  <line x1="30" y1="32" x2="30" y2="86" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="58" y1="32" x2="58" y2="86" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="86" y1="32" x2="86" y2="86" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Row numbers -->
  <rect x="19" y="38" width="6" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="19" y="56" width="6" height="5" rx="2.5" fill="#94a3b8"/>
  <rect x="19" y="74" width="6" height="5" rx="2.5" fill="#94a3b8"/>

  <!-- Row 1 -->
  <rect x="35" y="38" width="18" height="5" rx="2.5" fill="#64748b"/>
  <rect x="63" y="38" width="15" height="5" rx="2.5" fill="#64748b"/>
  <rect x="91" y="38" width="13" height="5" rx="2.5" fill="#0ea5e9"/>

  <!-- Row 2 -->
  <rect x="35" y="56" width="14" height="5" rx="2.5" fill="#64748b"/>
  <rect x="63" y="56" width="18" height="5" rx="2.5" fill="#64748b"/>
  <rect x="91" y="56" width="9" height="5" rx="2.5" fill="#0ea5e9"/>

  <!-- Row 3 -->
  <rect x="35" y="74" width="16" height="5" rx="2.5" fill="#64748b"/>
  <rect x="63" y="74" width="12" height="5" rx="2.5" fill="#64748b"/>
  <rect x="91" y="74" width="15" height="5" rx="2.5" fill="#0ea5e9"/>

  <!-- ── Format badge ── -->
  <rect x="14" y="94" width="100" height="20" rx="6" fill="#0f766e"/>
  <text x="64" y="108.5" text-anchor="middle"
        font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
        font-size="12" font-weight="bold" fill="#ffffff" letter-spacing="0.5">CSV / TSV</text>
</svg>
